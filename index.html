<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <script src="https://eases/1.5.0/aframe.min.jsscript>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist-aframe.prod.jsscript>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      feast.png
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        src="#feast"
        position="0 0 0"
        width="2"
        height="1.

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  https://aframe.io/releases/1.5.0/aframe.min.jsscript>

  https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.jsscript>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    feast.png
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled:false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    #feast
    </a-plane>
  </a-entity>

</a-scene>

</body>
</html>

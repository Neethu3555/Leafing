<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Onam AR Experience</title>

  <script src="https://aframe.io/0/aframe.min.jsscript>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@ndar-image-aframe.prod.jsscript>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      feast.png
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        src="#feast"
        position="0 0 0"
        width="1.8"
        height="1">
